<div class="detail-container">
  <!-- Botón de regreso -->
  <div class="back-button">
    <button mat-icon-button (click)="goBack()" class="back-btn">
      <mat-icon>arrow_back</mat-icon>
    </button>
  </div>

  <!-- Loading -->
  <div class="loading-container" *ngIf="loading">
    <mat-spinner></mat-spinner>
  </div>

  <!-- Error -->
  <div class="error-container" *ngIf="error && !loading">
    <h2>Película no encontrada</h2>
    <button mat-raised-button color="primary" (click)="goBack()">
      Volver al inicio
    </button>
  </div>

  <!-- Detalle de la película -->
  <div class="movie-detail" *ngIf="movie && !loading">
    <div class="movie-hero">
      <div class="backdrop-image" 
           [style.background-image]="'url(' + getImageUrl(movie.backdrop_path) + ')'">
      </div>
      <div class="hero-content">
        <div class="movie-poster">
          <img [src]="getImageUrl(movie.poster_path)" [alt]="movie.title">
        </div>
        <div class="movie-info">
          <h1>{{ movie.title }}</h1>
          <div class="movie-meta">
            <span class="rating">⭐ {{ movie.vote_average.toFixed(1) }}</span>
            <span class="year">{{ movie.release_date | date:'yyyy' }}</span>
            <span class="language">{{ movie.original_language.toUpperCase() }}</span>
          </div>
          <p class="overview">{{ movie.overview }}</p>
          <div class="movie-stats">
            <div class="stat">
              <span class="label">Popularidad:</span>
              <span class="value">{{ movie.popularity.toFixed(0) }}</span>
            </div>
            <div class="stat">
              <span class="label">Votos:</span>
              <span class="value">{{ movie.vote_count.toLocaleString() }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
